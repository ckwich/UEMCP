[project]
name = "uemcp"
version = "0.1.0"
description = "UEMCP: observability-first Unreal Engine integration via the Model Context Protocol."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.5.0,<1.6.0",
  "fastmcp>=0.4.1,<0.5.0",
  "uvicorn",
  "fastapi",
  "pydantic>=2.6.1",
  "requests"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0"
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["unreal_mcp_server", "uemcp_observability", "uemcp_neutrality", "uemcp_tool_surface"]
packages = ["tools", "profiles"]

[tool.setuptools.package-data]
profiles = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
